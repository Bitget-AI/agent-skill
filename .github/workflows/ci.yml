name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (skip postinstall to avoid touching ~/.claude)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate SKILL.md frontmatter
        run: node scripts/validate-skill.mjs || ls skills/
      - name: Re-generate references from current SDK
        run: node scripts/gen-references.js
      - name: Confirm references didn't drift
        run: |
          if [ -n "$(git status --porcelain references/commands.md)" ]; then
            echo "::error::references/commands.md is out of date — run 'node scripts/gen-references.js' and commit"
            git diff references/commands.md
            exit 1
          fi
